<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>牛头人 XP 小天地 | 首页</title>
    <link rel="icon" type="image/png" href="img/webcon/NTR logo.jpg">
    <link rel="shortcut icon" href="img/webcon/NTR logo.jpg">
    <link rel="apple-touch-icon" href="img/webcon/NTR logo.jpg">
    <style>
        /* ===== 全局重置 (承袭店家风格) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            background: #e4e6ea;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', Roboto, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 2rem 1.2rem;
            padding-top: 3rem;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        /* ===== LOGO (正方形) ===== */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 4.5rem;
        }

        .logo-main {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            object-fit: cover;
            display: block;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            transition: transform 0.25s ease;
            background: #eef0f2;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .logo-main:active {
            transform: scale(0.96);
        }
        .logo-fallback {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #4a5568;
            background: #e4e6ea;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            font-weight: 500;
        }

        /* ===== 导航网格 (四栏目) ===== */
        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin: 1.2rem 0 1.8rem 0;
        }

        .nav-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            padding: 1.6rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: #2d3748;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .nav-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.6);
        }
        /* ----- 禁用状态 (统一) ----- */
        .nav-card.disabled {
            opacity: 0.5;
            filter: grayscale(0.3);
            cursor: not-allowed;
        }
        /* 注意：移除 pointer-events: none，让点击事件可以触发 */
        .nav-card.disabled .nav-icon {
            opacity: 0.5;
        }
        .nav-card .nav-icon {
            font-size: 2.6rem;
            margin-bottom: 0.4rem;
            line-height: 1.2;
        }
        .nav-card .nav-label {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            color: #2d3748;
        }
        .nav-card .nav-badge {
            font-size: 0.65rem;
            background: rgba(0, 0, 0, 0.04);
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            color: #6b7a8f;
            margin-top: 0.2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ===== 底部占位 ===== */
        .footer-meta {
            margin-top: 2.8rem;
            color: #9aa0aa;
            font-size: 0.7rem;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 0.5rem 1rem;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ===== 自定义提示弹窗 (轻量) ===== */
        .toast-tip {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(12px);
            color: #f0f2f5;
            padding: 1.2rem 2rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 80%;
            text-align: center;
            line-height: 1.5;
            white-space: nowrap;
        }
        .toast-tip.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .toast-tip .toast-emoji {
            margin-right: 0.5rem;
        }

        @media (max-width: 480px) {
            .toast-tip {
                font-size: 0.85rem;
                padding: 0.9rem 1.2rem;
                white-space: normal;
                max-width: 85%;
                border-radius: 40px;
            }
        }

        /* ===== 响应式 (完全承袭店家页) ===== */
        @media (min-width: 600px) {
            body {
                padding: 3.5rem 2rem;
                padding-top: 4.5rem;
            }
            .container {
                max-width: 560px;
            }
            .logo-main {
                width: 84px;
                height: 84px;
                border-radius: 20px;
            }
            .logo-fallback {
                width: 84px;
                height: 84px;
                font-size: 2.2rem;
                border-radius: 20px;
            }
            .nav-card {
                min-height: 150px;
                padding: 1.8rem 0.5rem;
                border-radius: 48px;
            }
            .nav-card .nav-icon {
                font-size: 3rem;
            }
            .nav-card .nav-label {
                font-size: 1.1rem;
            }
            .nav-grid {
                gap: 1.5rem;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 1.5rem 0.8rem;
                padding-top: 2.5rem;
            }
            .logo-main {
                width: 60px;
                height: 60px;
                border-radius: 14px;
            }
            .logo-fallback {
                width: 60px;
                height: 60px;
                font-size: 1.6rem;
                border-radius: 14px;
            }
            .nav-card {
                min-height: 100px;
                padding: 1.2rem 0.3rem;
                border-radius: 32px;
            }
            .nav-card .nav-icon {
                font-size: 2rem;
            }
            .nav-card .nav-label {
                font-size: 0.85rem;
            }
            .nav-grid {
                gap: 0.8rem;
            }
            .footer-meta {
                font-size: 0.6rem;
                padding: 0.4rem 0.8rem;
            }
        }

        @media (max-width: 360px) {
            .nav-card {
                min-height: 80px;
                padding: 0.8rem 0.2rem;
            }
            .nav-card .nav-icon {
                font-size: 1.6rem;
            }
            .nav-card .nav-label {
                font-size: 0.7rem;
            }
            .nav-grid {
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container" role="main">

    <!-- ===== LOGO (正方形) ===== -->
    <div class="logo-wrapper">
        <img src="img/webcon/NTR logo.jpg" class="logo-main" alt="牛头人XP Logo" id="logoImage">
    </div>

    <!-- ===== 四个栏目 ===== -->
    <div class="nav-grid">
        <!-- 1. 论坛 (disabled) -->
        <a class="nav-card disabled" href="#" role="button" aria-disabled="true" data-disabled-msg="📢 论坛功能筹备中，敬请期待！">
            <span class="nav-icon">📢</span>
            <span class="nav-label">论坛</span>
            <span class="nav-badge">筹备中</span>
        </a>

        <!-- 2. 店家 (可用) -->
        <a class="nav-card shop-card" href="ntr-shop.html" role="button">
            <span class="nav-icon">🏪</span>
            <span class="nav-label">店家</span>
            <span class="nav-badge">· 探索 ·</span>
        </a>

        <!-- 3. FR (disabled) -->
        <a class="nav-card disabled fr-card" href="#" role="button" aria-disabled="true" data-disabled-msg="📝 FR 板块筹备中，即将上线！">
            <span class="nav-icon">📝</span>
            <span class="nav-label">FR</span>
            <span class="nav-badge">筹备中</span>
        </a>

        <!-- 4. 翻车 (disabled) -->
        <a class="nav-card disabled flip-card" href="#" role="button" aria-disabled="true" data-disabled-msg="💥 翻车专区筹备中，帮你避雷！">
            <span class="nav-icon">💥</span>
            <span class="nav-label">翻车</span>
            <span class="nav-badge">筹备中</span>
        </a>
    </div>

    <!-- ===== 小尾巴 ===== -->
    <div class="footer-meta">
        ⚡ 牛头人 XP · 首页 · v0.3
    </div>

    <!-- ===== Toast 提示浮层 ===== -->
    <div class="toast-tip" id="toastTip" role="alert">
        <span class="toast-emoji">🚧</span>
        <span id="toastMessage">功能筹备中</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ===== LOGO 图片加载失败 → 备用 =====
        const logoImg = document.getElementById('logoImage');
        if (logoImg) {
            logoImg.onerror = function() {
                this.style.display = 'none';
                const parent = this.parentElement;
                const fallback = document.createElement('div');
                fallback.className = 'logo-fallback';
                fallback.textContent = '◈';
                parent.appendChild(fallback);
            };
        }

        // ===== Toast 提示系统 =====
        const toastEl = document.getElementById('toastTip');
        const toastMsg = document.getElementById('toastMessage');
        let toastTimer = null;

        function showToast(message) {
            if (!toastEl || !toastMsg) return;
            // 清除之前的定时器
            if (toastTimer) {
                clearTimeout(toastTimer);
                toastTimer = null;
            }
            // 设置消息 (如果消息本身带emoji，则保留)
            toastMsg.textContent = message || '功能筹备中';
            // 显示
            toastEl.classList.add('show');
            // 自动隐藏
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
                toastTimer = null;
            }, 2000);
        }

        // ===== 所有 disabled 卡片点击 => 弹出提示 =====
        const disabledCards = document.querySelectorAll('.nav-card.disabled');
        disabledCards.forEach(card => {
            card.addEventListener('click', function(e) {
                e.preventDefault(); // 阻止链接跳转
                // 优先使用 data-disabled-msg，否则使用默认
                let msg = this.dataset.disabledMsg;
                if (!msg) {
                    const label = this.querySelector('.nav-label');
                    const name = label ? label.textContent : '该功能';
                    msg = `🚧 ${name} 筹备中，敬请期待！`;
                }
                showToast(msg);
            });
        });

        // ===== 店家卡片正常跳转，不做拦截 =====

        // ===== 额外：如果点击空白区域或误触，不影响 =====
        console.log('🏠 牛头人 XP 首页 · disabled 点击提示已启用');
    })();
</script>
</body>
</html>
