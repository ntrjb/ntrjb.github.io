<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>牛头人 XP 小天地 | 店家</title>
	<link rel="icon" type="image/png" href="NTR logo.jpg">
    <link rel="shortcut icon" href="NTR logo.jpg">
    <link rel="apple-touch-icon" href="NTR logo.jpg">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e4e6ea;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', Roboto, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 2rem 1.2rem;
            padding-top: 3rem;
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        /* ===== 正方形 LOGO ===== */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 5rem;
        }

        .logo-main {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            object-fit: cover;
            display: block;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06), 
                        0 1px 3px rgba(0, 0, 0, 0.04);
            transition: transform 0.25s ease;
            background: #eef0f2;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logo-main:active {
            transform: scale(0.96);
        }

        .logo-fallback {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #4a5568;
            background: #e4e6ea;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ===== 地区选择器 ===== */
        .region-picker {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin: 0.8rem 0 1.8rem 0;
            flex-wrap: wrap;
            background: #e4e6ea;
        }

        .region-btn {
            width: 90px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid transparent;
            background: #e4e6ea;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            padding: 0.5rem 0.3rem;
            gap: 3px;
            outline: none;
            flex-shrink: 0;
        }

        .region-btn:active {
            transform: scale(0.92);
        }

        .region-btn .flag-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.7);
            transition: all 0.25s ease;
            background: #e4e6ea;
        }

        .region-btn .label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #4a5568;
            margin-top: 2px;
            transition: color 0.2s;
            line-height: 1.2;
            text-align: center;
        }

        .region-btn.active .flag-icon {
            border-color: #3b5998;
            box-shadow: 0 0 0 3px rgba(59, 89, 152, 0.12);
        }

        .region-btn.active .label {
            color: #2d4373;
        }

        /* 感谢按钮 - 特殊样式 */
        .region-btn.thanks-btn .flag-icon {
            background: rgba(255, 215, 0, 0.12);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .region-btn.thanks-btn.active .flag-icon {
            border-color: #f5a623;
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.2);
        }

        .region-btn.thanks-btn.active .label {
            color: #b8860b;
        }

        /* ===== 店家列表 ===== */
        .shop-section {
            margin-top: 0.8rem;
            padding-top: 1.2rem;
            border-top: 2px solid rgba(0, 0, 0, 0.04);
            min-height: 130px;
        }

        .shop-section .placeholder {
            color: #9aa0aa;
            font-size: 0.9rem;
            padding: 1.4rem 0.5rem;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .shop-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding: 0.2rem 0;
        }

        /* ===== 店家卡片 - 三栏布局 ===== */
        .shop-item {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            padding: 0.7rem 1rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: background 0.15s, transform 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: default;
            min-height: 60px;
        }

        .shop-item:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.98);
        }

        .shop-item .shop-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #eef0f2;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .shop-item .shop-name {
            font-weight: 500;
            color: #2d3748;
            font-size: 0.9rem;
            flex: 1;
            text-align: left;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .shop-item .shop-actions {
            display: flex;
            gap: 0.3rem;
            flex-shrink: 0;
        }

        .shop-item .shop-actions a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .shop-item .shop-actions a:active {
            transform: scale(0.88);
        }

        .shop-item .btn-telegram {
            background: rgba(0, 136, 204, 0.15);
            color: #0088cc;
            border: 1px solid rgba(0, 136, 204, 0.15);
        }

        .shop-item .btn-telegram:hover {
            background: rgba(0, 136, 204, 0.25);
        }

        .shop-item .btn-whatsapp {
            background: rgba(37, 211, 102, 0.15);
            color: #25d366;
            border: 1px solid rgba(37, 211, 102, 0.15);
        }

        .shop-item .btn-whatsapp:hover {
            background: rgba(37, 211, 102, 0.25);
        }

        /* Google Maps 地址按钮 */
        .shop-item .btn-map {
            background: rgba(234, 67, 53, 0.12);
            color: #ea4335;
            border: 1px solid rgba(234, 67, 53, 0.15);
            font-size: 0.9rem;
        }

        .shop-item .btn-map:hover {
            background: rgba(234, 67, 53, 0.22);
        }

        .shop-item .shop-actions a.btn-map {
            font-size: 0.9rem;
        }

        .empty-shops {
            color: #9aa0aa;
            padding: 1.6rem 0.5rem;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* ===== 感谢页面 ===== */
        .thanks-content {
            padding: 2rem 1rem;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .thanks-content .thanks-icon {
            font-size: 4rem;
            margin-bottom: 0.8rem;
        }

        .thanks-content .thanks-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }

        .thanks-content .thanks-desc {
            font-size: 0.95rem;
            color: #4a5568;
            line-height: 1.6;
            max-width: 300px;
            margin: 0 auto;
        }

        .thanks-content .thanks-list {
            margin-top: 1.2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
        }

        .thanks-content .thanks-list .thanks-tag {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #8b7500;
            font-weight: 500;
        }

        /* ===== 响应式 ===== */
        @media (min-width: 600px) {
            body {
                padding: 3.5rem 2rem;
                padding-top: 4.5rem;
            }
            .container {

            }
            .logo-main {

                height: 84px;
                border-radius: 20px;

            .logo-fallback {

                height: 84px;
                font-size: 2.2rem;
                border-radius: 20px;

                height: 50px;
                font-size: 1.6rem;
            }
            .region-btn .label {
                font-size: 0.8rem;
            }
            .region-picker {
                gap: 1.5rem;
            }
            .shop-item .shop-logo {
                width: 50px;
                height: 50px;
            }
            .shop-item .shop-name {
                font-size: 1rem;
            }

                height: 38px;
                font-size: 1.1rem;
            }

            }

                border-radius: 14px;
            }
            .logo-fallback {
                width: 60px;
                height: 60px;
                font-size: 1.6rem;
                border-radius: 14px;
            }
            .region-btn {
                width: 72px;
                height: 80px;
            }
            .region-btn .flag-icon {
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
            }
            .region-btn .label {
                font-size: 0.6rem;
            }
            .region-picker {
                gap: 0.8rem;
            }
            .shop-item {
                padding: 0.5rem 0.7rem;
                border-radius: 40px;
                gap: 0.5rem;
                min-height: 48px;
            }
            .shop-item .shop-logo {
                width: 32px;
                height: 32px;
            }
            .shop-item .shop-name {
                font-size: 0.75rem;
            }
            .shop-item .shop-actions a {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            .shop-item .shop-actions a.btn-map {
                font-size: 0.7rem;
            }
            .shop-item .shop-actions {
                gap: 0.25rem;
            }
            .thanks-content .thanks-icon {
                font-size: 3rem;
            }
            .thanks-content .thanks-title {
                font-size: 1.1rem;
            }
            .thanks-content .thanks-desc {
                font-size: 0.85rem;
            }
            .region-btn.thanks-btn .flag-icon {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 360px) {
            .region-btn {
                width: 64px;
                height: 72px;
            }
            .region-btn .flag-icon {
                width: 32px;
                height: 32px;
                font-size: 1rem;
            }
            .region-btn .label {
                font-size: 0.55rem;
            }
            .region-picker {
                gap: 0.5rem;
            }
            .shop-item .shop-name {
                font-size: 0.65rem;
            }
            .shop-item .shop-actions a {
                width: 24px;
                height: 24px;
                font-size: 0.7rem;
            }
            .shop-item .shop-actions a.btn-map {
                font-size: 0.6rem;
            }
        }

</head>

            // 感谢页面数据
            const thanksData = {
                title: '🙏 感谢提供资料的用户',
                desc: '感谢以下热心用户提供店家资讯，让更多人发现好地方！',
                tags: ['@gouergege 狗儿','@MasterEthan MasterEthan 一灯大师', '@thisacountisunavailable 杰哥不要', '@super_9696 小V（外交部）']
            };

            // =============================================
            //  DOM 引用
            // =============================================
            const regionBtns = document.querySelectorAll('.region-btn');
            const placeholderMsg = document.getElementById('placeholderMsg');
            const shopListContainer = document.getElementById('shopListContainer');
            let activeRegion = null;

            // =============================================
            //  渲染感谢页面
            // =============================================
            function renderThanks() {
                shopListContainer.innerHTML = '';
                placeholderMsg.style.display = 'none';

                const container = document.createElement('div');
                container.className = 'thanks-content';

                const icon = document.createElement('div');
                icon.className = 'thanks-icon';
                icon.textContent = '🙏';

                const title = document.createElement('div');
                title.className = 'thanks-title';
                title.textContent = thanksData.title;

                const desc = document.createElement('div');
                desc.className = 'thanks-desc';
                desc.textContent = thanksData.desc;

                const tagContainer = document.createElement('div');
                tagContainer.className = 'thanks-list';

                thanksData.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'thanks-tag';
                    span.textContent = '✈️ ' + tag;
                    tagContainer.appendChild(span);
                });

                container.appendChild(icon);
                container.appendChild(title);
                container.appendChild(desc);
                container.appendChild(tagContainer);
                shopListContainer.appendChild(container);
            }

            // =============================================
            //  渲染店家列表
            // =============================================
            function renderShops(regionKey) {
                shopListContainer.innerHTML = '';
                placeholderMsg.style.display = 'none';

                const shops = shopData[regionKey];

                if (!shops || shops.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-shops';
                    empty.textContent = '🏷️ 该地区暂无店家';
                    shopListContainer.appendChild(empty);
                    return;
                }

                shops.forEach(shop => {
                    const item = document.createElement('div');
                    item.className = 'shop-item';

                    const logo = document.createElement('img');
                    logo.className = 'shop-logo';
                    logo.src = shop.logo || 'default-logo.png';
                    logo.alt = shop.name + ' logo';
                    logo.onerror = function() {
                        this.style.display = 'none';
                        const fallback = document.createElement('span');
                        fallback.className = 'shop-icon';
                        fallback.textContent = '🏪';
                        this.parentElement.insertBefore(fallback, this);
                    };

                    const name = document.createElement('span');
                    name.className = 'shop-name';
                    name.textContent = shop.name;

                    const actions = document.createElement('div');
                    actions.className = 'shop-actions';

                    // Telegram 按钮
                    if (shop.telegram) {
                        const tgBtn = document.createElement('a');
                        tgBtn.className = 'btn-telegram';
                        tgBtn.href = shop.telegram;
                        tgBtn.target = '_blank';
                        tgBtn.rel = 'noopener noreferrer';
                        tgBtn.innerHTML = '✈️';
                        tgBtn.setAttribute('aria-label', '联系 Telegram');
                        actions.appendChild(tgBtn);
                    }

                    // WhatsApp 按钮
                    if (shop.whatsapp) {
                        const waBtn = document.createElement('a');
                        waBtn.className = 'btn-whatsapp';
                        waBtn.href = shop.whatsapp;
                        waBtn.target = '_blank';
                        waBtn.rel = 'noopener noreferrer';
                        waBtn.innerHTML = '💬';
                        waBtn.setAttribute('aria-label', '联系 WhatsApp');
                        actions.appendChild(waBtn);
                    }

                    // Google Maps 地址按钮
                    if (shop.map) {
                        const mapBtn = document.createElement('a');
                        mapBtn.className = 'btn-map';
                        mapBtn.href = shop.map;
                        mapBtn.target = '_blank';
                        mapBtn.rel = 'noopener noreferrer';
                        mapBtn.innerHTML = '📍';
                        mapBtn.setAttribute('aria-label', '查看地址');
                        actions.appendChild(mapBtn);
                    }

                    item.appendChild(logo);
                    item.appendChild(name);
                    item.appendChild(actions);
                    shopListContainer.appendChild(item);
                });
            }

            // =============================================
            //  清除所有激活状态
            // =============================================
            function clearActive() {
                regionBtns.forEach(btn => btn.classList.remove('active'));
            }

            // =============================================
            //  设置激活地区
            // =============================================
            function setActiveRegion(regionKey, buttonEl) {
                if (activeRegion === regionKey) {
                    clearActive();
                    activeRegion = null;
                    shopListContainer.innerHTML = '';
                    placeholderMsg.style.display = 'block';
                    return;
                }

                clearActive();
                buttonEl.classList.add('active');
                activeRegion = regionKey;

                if (regionKey === 'thanks') {
                    renderThanks();
                } else {
                    renderShops(regionKey);
                }
            }

            // =============================================
            //  事件绑定
            // =============================================
            regionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const region = this.dataset.region;
                    if (region) setActiveRegion(region, this);
                });
            });

            // =============================================
            //  默认激活：新山 SPA
            // =============================================
            const defaultBtn = document.getElementById('regionJohorSpa');
            if (defaultBtn) {
                setActiveRegion('johor-spa', defaultBtn);
            } else {
                placeholderMsg.style.display = 'block';
            }

            // =============================================
            //  LOGO 图片加载失败 → 显示备用文字
            // =============================================
            const logoImg = document.getElementById('logoImage');
            if (logoImg) {
                logoImg.onerror = function() {
                    this.style.display = 'none';
                    const parent = this.parentElement;
                    const fallback = document.createElement('div');
                    fallback.className = 'logo-fallback';
                    fallback.textContent = '◈';
                    parent.appendChild(fallback);
                };
            }

        })();
    </script>
